<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kết quả kênh TikTok PG</title>
<style>
:root{--bg:#f4f4f5;--card:#fff;--ink:#14171b;--mut:#6b7280;--line:#e6e7ea;--ok:#0f8a4b;--okb:#e5f5ec;--bad:#d4183d;--badb:#fdecef;--tk1:#fe2c55;--tkc:#25f4ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0b0b0c;color:#fff;padding:12px 16px;box-shadow:0 2px 0 var(--tkc),0 4px 0 var(--tk1)}
header b{font-size:17px}header small{display:block;color:#b8b8be;font-size:12px}
.wrap{max-width:960px;margin:0 auto;padding:0 12px 40px}
.hero{margin-top:12px;border-radius:18px;padding:18px 16px;color:#fff;background:radial-gradient(120% 90% at 100% 0,rgba(254,44,85,.35),transparent 55%),radial-gradient(110% 90% at 0 100%,rgba(37,244,238,.28),transparent 55%),#0b0b0c}
.hero .t{font-size:23px;font-weight:900;line-height:1.2;text-shadow:-2px -1px 0 var(--tkc),2px 1px 0 var(--tk1)}
.hero p{margin:8px 0 10px;color:#d7d7db;font-size:14px}
.hero a{display:inline-block;border:1px solid #3a3a40;background:rgba(255,255,255,.06);color:#fff;border-radius:99px;padding:7px 12px;font-size:12.5px;font-weight:700;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.card h2{margin:0 0 4px;font-size:16px}.sub{color:var(--mut);font-size:12.5px;margin-bottom:8px}
.loc{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
select{font-size:14px;padding:7px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.stat{background:#f6f7f8;border-radius:12px;padding:10px}.stat small{display:block;color:var(--mut);font-size:12px}.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.cuon{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:12.5px}
th:first-child,td:first-child{text-align:left;white-space:normal}td.xau{color:var(--bad);font-weight:700}
td.nx{text-align:left;white-space:normal;min-width:170px;font-size:12.5px}
details.nhom{border:1px solid var(--line);border-radius:12px;margin-top:8px}
details.nhom>summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:800}
details.nhom>summary::-webkit-details-marker,details.pg>summary::-webkit-details-marker{display:none}
details.nhom>summary small{display:block;font-weight:500;color:var(--mut);font-size:12.5px}
details.pg{border-top:1px solid var(--line);margin:0 12px}
details.pg>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:9px 0}
details.pg>summary b::before{content:'▸ ';color:var(--mut)}details.pg[open]>summary b::before{content:'▾ '}
details.pg .so{font-size:12.5px;font-weight:700;white-space:nowrap}
.tot .so{color:var(--ok)}.yeu .so{color:var(--bad)}
.vrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0 7px 10px;border-left:3px solid var(--line);margin:0 0 8px;font-size:13px}
.vrow.tot{border-left-color:var(--ok)}.vrow.yeu{border-left-color:var(--bad)}
.vrow a{color:var(--tk1);font-weight:700;text-decoration:none}.vrow .sl{color:var(--mut);white-space:nowrap}.vrow .nx{grid-column:1/-1}
.trong{color:var(--mut);padding:10px 0}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.vrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><b id="tieuDe">Kết quả kênh TikTok PG</b><small id="capNhat">Đang tải…</small></header>
<div class="wrap" id="app"></div>
<script>
/* Trang ket qua kenh TikTok PG — doc data/ket-qua.json do robot scripts/quet-tiktok.mjs ghi. Cham diem theo LUAT, 0 token. */
var D = null, CH = {}, KY = 'tuan', NHOM = '';
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function so(x){ return Number(x || 0).toLocaleString('vi-VN'); }
function ngayVN(d){ return d ? d.slice(8, 10) + '/' + d.slice(5, 7) : ''; }
function homNay(){ return new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10); }
function congNgay(d, n){ var t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); }
function tuoi(v){ return Math.round((Date.parse(homNay()) - Date.parse(v.d)) / 864e5); }
function trongKy(d){
  var hn = homNay();
  if(KY === 'tuan'){ var thu = (new Date(hn + 'T00:00:00Z').getUTCDay() + 6) % 7; return d >= congNgay(hn, -thu) && d <= hn; }
  if(KY === '7ngay') return d >= congNgay(hn, -6) && d <= hn;
  if(KY === 'thang') return d.slice(0, 7) === hn.slice(0, 7);
  return d === KY;
}
function bang(cot, dong, xau){
  return '<div class="cuon"><table><tr>' + cot.map(function(c){ return '<th>' + esc(c) + '</th>'; }).join('') + '</tr>'
    + dong.map(function(d){ return '<tr>' + d.map(function(x, j){ var cls = (xau && xau(d, j)) ? 'xau' : (j === d.length - 1 && typeof x === 'string' && j > 2 ? 'nx' : ''); return '<td class="' + cls + '">' + esc(typeof x === 'number' ? so(x) : x) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>';
}
function nhanXet(v){
  var tl = v.n ? (v.l + v.c + v.s) / v.n * 100 : 0;
  if(v.n > CH.cao) return 'Tương tác ' + tl.toFixed(1) + '%' + (v.c ? ' · ' + v.c + ' bình luận' : '') + ' → xem câu mở + chủ đề, dùng làm mẫu' + (v.c ? '. Nhắc PG trả lời bình luận' : '') + '.';
  return (tl >= 5 ? 'Ít người thấy nhưng người xem thích (' + tl.toFixed(1) + '%) → 3 giây đầu chưa giữ người lướt, sửa câu mở' : 'Ít xem, ít tương tác → đổi chủ đề sát câu khách hỏi ở quầy, mở bằng vấn đề, demo máy ngay') + '.';
}
function dongV(v){
  return '<div class="vrow ' + (v.n > CH.cao ? 'tot' : 'yeu') + '"><span><a href="https://www.tiktok.com/@' + encodeURIComponent(v.h) + '/video/' + encodeURIComponent(v.id) + '" target="_blank" rel="noopener">▶ Video đăng ' + ngayVN(v.d) + '</a></span><span class="sl">👁 ' + so(v.n) + ' · ❤ ' + so(v.l) + ' · 💬 ' + so(v.c) + ' · ↗ ' + so(v.s) + '</span><span class="nx">' + esc(nhanXet(v)) + '</span></div>';
}
function theoKenh(list, loai){
  var G = {}, thu = [];
  list.forEach(function(v){ if(!G[v.h]){ G[v.h] = []; thu.push(v.h); } G[v.h].push(v); });
  var tong = function(h){ return G[h].reduce(function(a, v){ return a + v.n; }, 0); };
  thu.sort(function(a, b){ return loai === 'tot' ? tong(b) - tong(a) : (G[b].length - G[a].length) || (tong(a) - tong(b)); });
  return thu.map(function(h){
    return '<details class="pg ' + loai + '"><summary><b>@' + esc(h) + ' <small style="font-weight:400;color:var(--mut)">· ' + esc(D.taiKhoan[h].nhom) + '</small></b><span class="so">' + G[h].length + ' video · ' + so(tong(h)) + ' view</span></summary>' + G[h].map(dongV).join('') + '</details>';
  }).join('');
}
function ve(){
  var nhoms = {}; Object.keys(D.taiKhoan).forEach(function(h){ nhoms[D.taiKhoan[h].nhom] = 1; });
  var ds = D.video.filter(function(v){ return trongKy(v.d) && (!NHOM || D.taiKhoan[v.h].nhom === NHOM); });
  var tag = ds.filter(function(v){ return v.t; });
  var T = { view: 0, tim: 0, cmt: 0, share: 0 }; tag.forEach(function(v){ T.view += v.n; T.tim += v.l; T.cmt += v.c; T.share += v.s; });
  var tt = T.tim + T.cmt + T.share;
  var ngays = {}; D.video.forEach(function(v){ if(v.d.slice(0, 7) === homNay().slice(0, 7)) ngays[v.d] = 1; });
  var opt = [['tuan', 'Tuần này'], ['7ngay', '7 ngày gần nhất'], ['thang', 'Tháng này']].concat(Object.keys(ngays).sort().reverse().map(function(d){ return [d, 'Ngày ' + ngayVN(d)]; }));
  var h = '<div class="hero"><div class="t">Kết quả kênh PG · ' + esc(D.khuVuc) + '</div><p>Robot quét TikTok lúc 6h sáng mỗi ngày. Chỉ tính video có <b>#' + esc(D.hashtag) + '</b>. Nhận xét do máy tự chấm theo số, chưa xem nội dung video.</p>' + (CH.linkHuongDan ? '<a href="' + esc(CH.linkHuongDan) + '" target="_blank" rel="noopener">📘 Hướng dẫn PG làm kênh + 20 video</a>' : '') + '</div>';
  h += '<div class="card"><h2>Tổng khu vực</h2><div class="loc"><select onchange="KY=this.value;ve()">' + opt.map(function(o){ return '<option value="' + o[0] + '"' + (o[0] === KY ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>'
    + '<select onchange="NHOM=this.value;ve()"><option value="">Tất cả nhóm</option>' + Object.keys(nhoms).sort().map(function(n){ return '<option' + (n === NHOM ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') + '</select></div>'
    + '<div class="stats"><div class="stat"><small>Video có #tag</small><b>' + so(tag.length) + '</b><small>' + (ds.length - tag.length) + ' video chưa gắn tag</small></div><div class="stat"><small>Lượt xem</small><b>' + so(T.view) + '</b></div><div class="stat"><small>Tương tác</small><b>' + so(tt) + '</b><small>tỉ lệ ' + (T.view ? (tt / T.view * 100).toFixed(1) : 0) + '%</small></div>'
    + '<div class="stat"><small>Tim</small><b>' + so(T.tim) + '</b></div><div class="stat"><small>Bình luận</small><b>' + so(T.cmt) + '</b></div><div class="stat"><small>Chia sẻ</small><b>' + so(T.share) + '</b></div></div></div>';
  // bang theo nhom
  var G = {};
  Object.keys(D.taiKhoan).forEach(function(k){ var n = D.taiKhoan[k].nhom; if(NHOM && n !== NHOM) return; var g = G[n] || (G[n] = { kenh: 0, coVideo: {}, bai: 0, view: 0, tim: 0, tt: 0, chua: 0 }); g.kenh++; });
  ds.forEach(function(v){ var g = G[D.taiKhoan[v.h].nhom]; if(v.t){ g.bai++; g.view += v.n; g.tim += v.l; g.tt += v.l + v.c + v.s; g.coVideo[v.h] = 1; } else g.chua++; });
  var keys = Object.keys(G).sort(function(a, b){ return G[b].view - G[a].view; });
  h += '<div class="card"><h2>Theo nhóm</h2>' + bang(['Nhóm', 'Kênh có video', 'Video', 'View', 'Tương tác', 'Tim', 'Chưa tag'], keys.map(function(k){ var g = G[k]; return [k, Object.keys(g.coVideo).length + '/' + g.kenh, g.bai, g.view, g.tt, g.tim, g.chua]; }), function(d, j){ return j === 6 && d[6] > 0; }) + '</div>';
  // phan nhom video
  var cao = tag.filter(function(v){ return v.n > CH.cao; }).sort(function(a, b){ return b.n - a.n; });
  var thap = tag.filter(function(v){ return v.n < CH.thap && tuoi(v) >= 2; });
  var moi = tag.filter(function(v){ return v.n < CH.thap && tuoi(v) < 2; }).length;
  var dem = function(l){ var o = {}; l.forEach(function(v){ o[v.h] = 1; }); return Object.keys(o).length; };
  h += '<div class="card"><h2>Phân nhóm video</h2><div class="sub">Bấm tên kênh để xem từng video.' + (moi ? ' ' + moi + ' video mới đăng dưới 2 ngày chưa xét.' : '') + '</div>'
    + '<details class="nhom" open><summary style="color:var(--ok)">🔥 Trên ' + so(CH.cao) + ' view · ' + cao.length + ' video · ' + dem(cao) + ' kênh<small>Học cách làm: câu mở, chủ đề, cách quay. Nhân bản cho cả nhóm.</small></summary>' + (theoKenh(cao, 'tot') || '<div class="trong" style="margin:0 12px">Chưa có video nào.</div>') + '</details>'
    + '<details class="nhom" open><summary style="color:var(--bad)">🧊 Dưới ' + so(CH.thap) + ' view · ' + thap.length + ' video · ' + dem(thap) + ' kênh<small>Đăng từ 2 ngày trở lên. Kênh có nhiều video nhất đứng đầu, kèm trước.</small></summary>' + (theoKenh(thap, 'yeu') || '<div class="trong" style="margin:0 12px">Không có video nào.</div>') + '</details></div>';
  // danh gia tung kenh
  var P = {};
  tag.forEach(function(v){ var o = P[v.h] || (P[v.h] = { h: v.h, n: 0, view: 0, cao: 0, thap: 0 }); o.n++; o.view += v.n; if(v.n > CH.cao) o.cao++; else if(v.n < CH.thap && tuoi(v) >= 2) o.thap++; });
  var soNgay = KY === 'thang' ? +homNay().slice(8) : KY === '7ngay' ? 7 : KY === 'tuan' ? ((new Date(homNay() + 'T00:00:00Z').getUTCDay() + 6) % 7) + 1 : 1;
  var kl = function(o){ var tb = o.view / o.n;
    if(o.cao >= 2 || (o.cao >= 1 && tb >= CH.thap)) return 'Đang làm đúng: lấy video làm mẫu cho nhóm';
    if(o.thap >= Math.max(2, o.n * 0.6)) return 'Cần kèm: đa số video dưới ' + CH.thap + ' view, xem lại câu mở và chủ đề';
    if(soNgay >= 7 && o.n < 3) return 'Đăng thưa: chưa đủ 3 video/tuần';
    return 'Ổn định: thử 1 chủ đề của nhóm 🔥'; };
  var dsP = Object.keys(P).map(function(k){ return P[k]; }).sort(function(a, b){ return (b.cao - a.cao) || (b.view / b.n - a.view / a.n); });
  var chuaDang = Object.keys(D.taiKhoan).filter(function(k){ return (!NHOM || D.taiKhoan[k].nhom === NHOM) && !P[k]; });
  h += '<div class="card"><h2>Đánh giá từng kênh</h2>' + bang(['Kênh', 'Video', '🔥', '🧊', 'View TB', 'Nhận định'], dsP.map(function(o){ return ['@' + o.h + ' · ' + D.taiKhoan[o.h].nhom, o.n, o.cao, o.thap, Math.round(o.view / o.n), kl(o)]; }), function(d, j){ return j === 3 && d[3] > 0 && d[3] >= d[1] * 0.6; })
    + (chuaDang.length ? '<div class="sub" style="margin-top:8px;color:var(--bad)"><b>Chưa có video có tag trong kỳ (' + chuaDang.length + '):</b> ' + chuaDang.map(function(k){ return '@' + esc(k) + (D.taiKhoan[k].ok ? '' : ' (robot chưa đọc được)'); }).join(', ') + '</div>' : '') + '</div>';
  document.getElementById('app').innerHTML = h;
}
Promise.all([
  fetch('data/ket-qua.json?t=' + Date.now(), { cache: 'no-store' }).then(function(r){ if(!r.ok) throw 0; return r.json(); }),
  fetch('cau-hinh.json?t=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.ok ? r.json() : {}; }).catch(function(){ return {}; })
]).then(function(x){
  D = x[0]; CH = { cao: x[1].nguongCao || 1000, thap: x[1].nguongThap || 300, linkHuongDan: x[1].linkHuongDan || '' };
  document.getElementById('tieuDe').textContent = 'Kết quả kênh PG · ' + D.khuVuc;
  var t = new Date(Date.parse(D.capNhat) + 7 * 3600e3).toISOString();
  document.getElementById('capNhat').textContent = 'Số lúc ' + t.slice(11, 16) + ' ' + ngayVN(t.slice(0, 10)) + ' · robot đọc được ' + D.docDuoc + '/' + D.luotNay + ' kênh';
  ve();
}).catch(function(){ document.getElementById('app').innerHTML = '<div class="card"><h2>Chưa có số</h2><div class="sub">Robot chưa chạy lần nào. Vào tab Actions của repo → "Quet TikTok PG" → Run workflow.</div></div>'; document.getElementById('capNhat').textContent = ''; });
</script>
</body>
</html>
